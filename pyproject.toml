[project]
name = "galaxy3"
version = "0.1.0"
description = "Galaxy3 — Experimento 1: CNN propia entrenada desde cero"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "scikit-learn>=1.9.0",
    "mlflow>=2.18.0",
    "h5py>=3.12.0",
    "jupyterlab>=4.6.3",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galaxy3"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
